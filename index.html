<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2ec">
<meta name="description" content="Boutique SI — baskets choisies avec soin. أحذية رياضية مختارة بعناية.">
<title>Boutique SI</title>
<link rel="icon" id="ico" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf9f6;--bar:#f6f2ec;--card:#fff;--frame:#efe8dd;--ink:#1a1714;--mute:#7d766d;--line:#e8e1d7;
--o1:#c9502a;--o2:#e8823a;--grad:linear-gradient(90deg,var(--o1),var(--o2));--grad2:linear-gradient(135deg,#f3e6d8,#fff);
--ok:#1f9d63;--no:#e05252;--gold:#c9972a;--f:"Cairo",system-ui,sans-serif;--sh:0 6px 22px rgba(60,40,20,.06);--sh2:0 14px 34px rgba(60,40,20,.14)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--f);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--o1);outline-offset:2px}
.bar{position:sticky;top:0;z-index:20;background:rgba(246,242,236,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar>div{max-width:1120px;margin:auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.14em;background:none;border:0}
.brand img{width:52px;height:52px;border-radius:50%}
.brand b{color:var(--o1)}
.acts{display:flex;gap:10px}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 18px;font-weight:600;font-size:.92rem;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.pill i{font-style:normal;background:var(--grad);color:#fff;border-radius:999px;padding:0 8px;margin-inline-start:6px;font-size:.8rem}
main{max-width:1120px;margin:auto;padding:28px 20px 60px}
.hero{text-align:center;padding:clamp(36px,7vw,72px) 20px;border-radius:28px;border:1px solid var(--line);background:linear-gradient(160deg,#fff,#f3ece2)}
.hero h1{font-weight:800;font-size:clamp(2.4rem,7vw,4.2rem);line-height:1.1}
.hero h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.slogan{font-weight:600;font-size:clamp(1.2rem,3vw,1.7rem);margin:12px 0 8px;color:var(--o1)}
.sub{color:var(--mute);max-width:560px;margin:0 auto 24px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.chips span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:.9rem}
h2{font-weight:800;font-size:1.7rem;margin:44px 0 4px}
.lead{color:var(--mute);margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 6px 22px rgba(60,40,20,.06);display:flex;flex-direction:column;transition:box-shadow .25s}
.card.click{cursor:pointer}.card.click:hover{box-shadow:0 10px 30px rgba(60,40,20,.12)}
.frame{background:var(--frame);padding:14px;position:relative}
.frame img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:#ddd}
.frame img.off{filter:grayscale(.6);opacity:.7}
.tag{position:absolute;top:24px;inset-inline-end:24px;background:#fff;border-radius:999px;padding:1px 12px;font-size:.82rem;font-weight:600}
.tag.ok{color:var(--ok)}.tag.no{color:var(--no)}
.info{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.info h3{font-weight:800;font-size:1.15rem}
.price{display:inline-block;background:var(--grad);color:#fff;font-weight:800;border-radius:999px;padding:6px 18px;box-shadow:0 6px 16px rgba(201,80,42,.28);white-space:nowrap}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mute{color:var(--mute);font-size:.9rem}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.sz{min-width:44px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bar);font-weight:600}
.sz:hover:not(:disabled){border-color:var(--o1)}.sz.on{background:var(--ink);color:#fff;border-color:var(--ink)}.sz:disabled{opacity:.35;cursor:not-allowed}
.btn{border:0;border-radius:14px;background:var(--grad);color:#fff;font-weight:800;padding:12px 18px;width:100%}
.btn:disabled{background:#b9b3ab;cursor:not-allowed}
.back{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.back h2{margin:0}
.state{text-align:center;color:var(--mute);padding:50px 0}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--o1);border-radius:50%;margin:0 auto 12px;animation:s .9s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.contact{text-align:center;border-top:1px solid var(--line);margin-top:56px;padding-top:28px}
.contact .chips{margin-top:14px}
.contact a{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 20px;text-decoration:none;color:inherit;font-weight:600}
.contact a:hover{border-color:var(--o1)}
.shade{position:fixed;inset:0;background:rgba(26,23,20,.4);z-index:40}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(460px,100%);background:var(--bg);z-index:50;overflow:auto;padding:22px;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
[hidden]{display:none!important}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.dh h3{font-weight:800;font-size:1.3rem}
.x{background:none;border:0;font-size:2rem;line-height:1;color:var(--mute)}
.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;display:grid;gap:10px}
.item .top{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.item .rm{background:none;border:0;color:var(--mute);font-size:.85rem;text-decoration:underline}
.item .bot{display:flex;justify-content:space-between;align-items:center}
select,input,textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 16px;background:#fff;color:var(--ink)}
select:focus,input:focus,textarea:focus{border-color:var(--o1);outline:none}
.item select{width:auto;padding:6px 10px}
.qty{display:flex;align-items:center;gap:10px;font-weight:800}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:1.1rem}
.tot{display:flex;justify-content:space-between;align-items:center;margin:16px 0;font-weight:800}
form{display:grid;gap:12px}
.done{text-align:center;padding:40px 0}.done h3{font-weight:800;font-size:1.5rem;margin-bottom:8px}.done .btn{margin-top:14px;display:block;text-decoration:none}
html{scroll-behavior:smooth;scroll-padding-top:96px}
.cta{width:auto;display:inline-block;margin-top:24px;padding:13px 34px;text-decoration:none;box-shadow:0 8px 20px rgba(201,80,42,.3)}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.tools>input{flex:2 1 200px;min-width:0}.tools select{flex:1 1 140px;width:auto}
.swf{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 10px;flex:1 1 180px;overflow-x:auto}
.swb{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid #fff;background:var(--c,transparent);box-shadow:0 0 0 1px var(--line);cursor:pointer;display:grid;place-items:center;color:var(--mute)}
.swb.on{box-shadow:0 0 0 2px var(--o1)}
.tools .chk{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 16px;cursor:pointer}
.tools .chk input{width:auto;accent-color:var(--o1)}
.dots{display:flex;gap:6px}.dot{width:15px;height:15px;border-radius:50%;border:1px solid var(--line);background:var(--c)}
.low{color:var(--o1);font-size:.85rem;font-weight:600}
#vgrid .frame img{cursor:zoom-in}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:14px}
@media(max-width:700px){.steps{grid-template-columns:1fr}}
.steps>div{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;gap:14px;align-items:flex-start}
.steps b{flex:none;width:36px;height:36px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center}
.steps p{font-weight:800}.steps small{display:block;color:var(--mute);font-weight:400}
.thumb{width:60px;height:60px;border-radius:10px;object-fit:cover;flex:none}
.row2{display:flex;gap:12px;align-items:center}
.lb{position:fixed;inset:0;background:rgba(26,23,20,.85);z-index:70;display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:92vh;border-radius:12px}
.fab{position:fixed;bottom:20px;inset-inline-start:20px;z-index:30;background:#25a05a;color:#fff;border-radius:999px;padding:11px 20px;font-weight:800;text-decoration:none;box-shadow:0 8px 22px rgba(0,0,0,.2)}
footer{border-top:1px solid var(--line);background:var(--bar);text-align:center;padding:28px 20px;color:var(--mute);font-size:.9rem}
footer img{width:56px;height:56px;border-radius:50%;margin-bottom:6px}
body{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
svg{flex:none}em{display:inline-flex;font-style:normal}
.btn,.pill,.chips span,.contact a,.fab{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.brand span{white-space:nowrap}.hl{width:84px;height:84px;border-radius:50%;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.fh{font-weight:800;margin:6px 0 10px;display:flex;align-items:center;gap:8px}
.fld{display:grid;gap:6px}.fl{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:.86rem;font-weight:600}
form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fe{color:var(--no);font-size:.82rem}[aria-invalid=true]{border-color:var(--no)!important}
form .btn[type=submit]{position:sticky;bottom:10px;min-height:52px;box-shadow:0 8px 24px rgba(201,80,42,.35)}
.done{display:grid;gap:12px;justify-items:center;text-align:center;padding:24px 0}
.done .btn{display:inline-flex;margin-top:4px;width:100%}
.ok-ic{width:64px;height:64px;border-radius:50%;background:#e6f6ee;color:var(--ok);display:grid;place-items:center}
.ref{background:var(--bar);border-radius:999px;padding:4px 16px}
.sum{width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:8px;text-align:start;font-size:.92rem}
.sum div{display:flex;justify-content:space-between;gap:10px}.sum .st{font-weight:800;border-top:1px dashed var(--line);padding-top:8px}
@media(max-width:600px){
 main{padding:14px 12px 90px}.bar>div{padding:8px 12px}
 .brand{letter-spacing:.06em;font-size:.95rem;gap:8px}.brand img{width:40px;height:40px}
 .pill{padding:8px 13px;min-height:40px}
 .hero{padding:28px 14px;border-radius:22px}.hl{width:68px;height:68px}
 h2{font-size:1.4rem;margin-top:32px}
 .grid{grid-template-columns:repeat(2,1fr);gap:12px}#vgrid{grid-template-columns:1fr}
 .frame{padding:8px}.tag{top:14px;inset-inline-end:14px}
 .info{padding:12px}.info h3{font-size:1rem}.price{padding:4px 12px;font-size:.9rem}.meta{flex-wrap:wrap}
 .sz{min-width:46px;min-height:42px}.btn{min-height:48px}
 .tools>input{flex:1 1 100%}.tools select{flex:1 1 45%}.tools .chk{flex:1 1 100%;min-height:44px}
 .drawer{width:100%;padding:16px}
 .fab span{display:none}.fab{width:54px;height:54px;padding:0;bottom:16px;inset-inline-start:14px}
 .contact a{min-height:44px}
}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts[aria-invalid=true]{border:1px solid var(--no);border-radius:14px;padding:4px}
.opt{cursor:pointer;display:block}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{display:flex;flex-direction:column;gap:2px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:76px;transition:border-color .2s}
.opt b{font-weight:800}.opt small{color:var(--mute);font-size:.8rem}.opt svg{color:var(--o1)}
.opt input:checked+span{border-color:var(--o1);background:#fff6f0;box-shadow:0 0 0 3px rgba(201,80,42,.12)}
.opt input:focus-visible+span{outline:2px solid var(--o1);outline-offset:2px}
.opt span{min-width:0}
.sk .ph{aspect-ratio:1;border-radius:6px;background:linear-gradient(90deg,#e9e3d9,#f4efe7,#e9e3d9);background-size:200% 100%;animation:sh 1.2s infinite}
.sk i{display:block;height:14px;border-radius:7px;background:#eee7dc;width:70%;margin-bottom:8px}.sk i+i{width:40%}
@keyframes sh{to{background-position:-200% 0}}
.cbar{position:fixed;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 24px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--ink);color:#fff;border:0;border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.cbar .price{box-shadow:none}
body.hascart .fab{bottom:86px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:#fff;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18);border-radius:14px;padding:10px 16px;display:flex;gap:8px;align-items:center;font-weight:600;width:max-content;max-width:calc(100% - 24px)}
.toast svg{color:var(--ok)}
.tots{display:grid;gap:8px;margin:14px 0}.tots>div{display:flex;justify-content:space-between;align-items:center}
.tots .disc{color:var(--ok);font-weight:600}.tots .tt{font-weight:800;border-top:1px dashed var(--line);padding-top:10px}.tots .tt .price{font-size:1.2rem}
.hint{display:flex;gap:8px;align-items:center;background:#fff6f0;border:1px solid #f3d5c4;color:var(--o1);border-radius:12px;padding:8px 12px;font-size:.88rem;font-weight:600}
.chips .promo{background:#fff6f0;border-color:#f3d5c4;color:var(--o1);font-weight:600}
.promo-line{display:inline-flex;align-items:center;gap:8px;background:#fff6f0;border:1px solid #f3d5c4;color:var(--o1);font-weight:600;border-radius:999px;padding:4px 16px;margin-bottom:14px}
.sum .okd{color:var(--ok)}
@media(max-width:480px){form .two{grid-template-columns:1fr}.opts{gap:8px}.opt span{padding:10px;min-height:68px}.opt b{font-size:.88rem;line-height:1.25}.opt small{font-size:.72rem}}

/* ---- extra polish ---- */
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.card{animation:pop .35s ease both}
.hero{position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40% -10% auto auto;width:320px;height:320px;background:var(--grad);opacity:.10;border-radius:50%;filter:blur(10px)}
.hero::after{content:"👟";position:absolute;font-size:2.6rem;opacity:.12;bottom:10px;inset-inline-start:20px;animation:float 4s ease-in-out infinite}
.brand img{box-shadow:0 0 0 2px #fff,0 0 0 3px var(--o1)}
.pill{transition:transform .15s,box-shadow .15s}
.pill:active{transform:scale(.96)}
#cart-btn.bump i{animation:bump .35s}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.35)}}
.card.click{position:relative}
.card.click::after{content:"";position:absolute;inset:0;border-radius:22px;box-shadow:0 0 0 2px var(--o1);opacity:0;transition:opacity .2s;pointer-events:none}
.card.click:hover::after,.card.click:focus-visible::after{opacity:1}
.new-badge{position:absolute;top:24px;inset-inline-start:24px;background:var(--gold);color:#fff;font-size:.72rem;font-weight:800;border-radius:999px;padding:3px 11px;letter-spacing:.02em;box-shadow:0 4px 10px rgba(201,151,42,.35)}
.sz{transition:transform .15s}
.sz.on{transform:scale(1.06)}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:36px 0}
@media(max-width:700px){.trust{grid-template-columns:1fr}}
.trust>div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center;box-shadow:var(--sh)}
.trust svg{color:var(--o1);margin-bottom:8px}
.trust b{display:block;font-size:1rem;margin-bottom:2px}
.trust small{color:var(--mute)}
.rating{display:flex;align-items:center;gap:2px;color:var(--gold);margin-bottom:6px}
.rating span{color:var(--mute);font-size:.82rem;margin-inline-start:4px}
.frame{transition:background .2s}
.card.click:hover .frame{background:#e9dfd0}
.socials a{display:inline-flex;gap:8px;align-items:center}
.contact{background:var(--grad2);border-radius:28px;border:1px solid var(--line);padding:40px 20px;margin-top:56px}
.prog{position:fixed;top:0;left:0;height:3px;width:0;background:var(--grad);z-index:30;transition:width .1s linear}
.bar.raised{box-shadow:0 4px 16px rgba(0,0,0,.06)}
@media(max-width:600px){.trust>div{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.hero::after{display:none}.card{animation:none}}
</style>
</head>
<body>
<div class="prog" id="prog"></div>
<header class="bar"><div>
  <button class="brand" id="home"><img class="lg" alt="SI Boutique" width="52" height="52"><span><b>SI</b> BOUTIQUE</span></button>
  <div class="acts">
    <button class="pill" id="cart-btn"><em data-ic="cart"></em><span data-t="cart"></span><i id="cnt">0</i></button>
    <button class="pill" id="lang"><em data-ic="globe"></em><span id="lang-t"></span></button>
  </div>
</div></header>

<main>
  <section class="hero">
    <img class="lg hl" alt="" width="84" height="84">
    <h1>Boutique <span>SI</span></h1>
    <p class="slogan" data-t="slogan"></p>
    <p class="sub" data-t="sub"></p>
    <div class="chips"><span><em data-ic="truck"></em><span data-t="c1"></span></span><span><em data-ic="shield"></em><span data-t="c2"></span></span><span><em data-ic="swap"></em><span data-t="c3"></span></span><span class="promo"><em data-ic="tag"></em><span data-t="promo"></span></span></div>
    <a class="btn cta" href="#models" data-t="cta"></a>
  </section>

  <div id="state" class="state"></div>

  <section id="home-view" hidden>
    <h2 id="models" data-t="ours"></h2><p class="lead" data-t="oursSub"></p>
    <div class="tools" id="tools"></div>
    <div class="grid" id="grid"></div>
    <h2 data-t="how"></h2>
    <div class="steps">
      <div><b>1</b><p><span data-t="s1"></span><small data-t="s1d"></small></p></div>
      <div><b>2</b><p><span data-t="s2"></span><small data-t="s2d"></small></p></div>
      <div><b>3</b><p><span data-t="s3"></span><small data-t="s3d"></small></p></div>
    </div>
  </section>

  <section id="prod-view" hidden>
    <div class="back"><button class="pill" id="back" data-t="back"></button><h2 id="p-name"></h2><span class="price" id="p-price"></span></div>
    <p class="lead" data-t="pickSub"></p>
    <p class="promo-line"><em data-ic="tag"></em><span id="promoTxt"></span></p>
    <div class="grid" id="vgrid"></div>
    <h2 data-t="more"></h2><div class="grid" id="more-grid"></div>
  </section>

  <section class="contact"><h2 data-t="contact"></h2><p class="mute" data-t="contactSub"></p><div class="chips" id="socials"></div></section>
</main>

<footer><img class="lg" alt="SI Boutique" width="56" height="56"><p data-t="foot" style="font-weight:600;color:var(--o1)"></p><div class="socials" id="fsocials" style="margin:10px 0"></div><p>© <span id="yr"></span> Boutique SI</p></footer>
<a class="fab" id="fab" hidden target="_blank" rel="noopener" aria-label="WhatsApp"></a>
<button class="cbar" id="cbar" hidden></button>
<div class="shade" id="shade" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Panier"><div id="dbody"></div></aside>

<script>
/* ===== CONFIG ===== */
const CONFIG={
  API:"https://script.google.com/macros/s/AKfycbyzqTNB_lM73fswDSkW4mjiFrNT_hV8zHxFisGb1x3mdb8dpzkUWwQYLpkMMtpngRwO/exec",
  COUNTRY_CODE:"213",

let P=[],L={},cart=store("si_cart")||[],cur=null,sel={};

function build(d){
  const vars=d.variantes||[];
    P=(d.categories||[]).map(c=>({id:String(c.Category),name:c.Name,price:Number(c.Price)||0,img:c.ImageURL,
      v:vars.filter(v=>String(v.Category)===String(c.Category)).map(v=>{const dk=Object.keys(v).find(k=>k.toLowerCase().startsWith("dispo"));
        return{col:String(v.Colour).trim(),img:v.ImageURL,sizes:String(v.Sizes).split(/[\s,;\/]+/).filter(Boolean).sort((a,b)=>a-b),ok:String(v[dk]).trim().toLowerCase()==="oui"}})}));
    L=d.links||{};
    cart=cart.filter(i=>P.find(p=>p.id===i.pid&&p.v[i.vi]));
}
async function init(){
  const cached=store("si_data");if(cached){try{build(cached);if(P.length){$("#state").hidden=true;buildTools();show()}}catch(e){console.warn(e)}}
  $("#state").hidden=false;$("#state").innerHTML=skel();
  try{
    const r=await fetch(CONFIG.API);if(!r.ok)throw new Error("HTTP "+r.status);
    const txt=await r.text();let d;try{d=JSON.parse(txt)}catch{throw new Error("The script did not return JSON (is the deployment public: Anyone?)")}
    store("si_data",d);build(d);
    if(!P.length){$("#state").innerHTML=`<p>${t("none")}</p>`;return}
    $("#state").hidden=true;buildTools();show();
  }catch(e){
    if(P.length){console.warn(e);return}
    console.error(e);
    $("#state").innerHTML=`<p>${t("err")}</p><p class="mute" dir="ltr" style="margin:8px 0 14px;font-size:.8rem">${esc(e.message||e)}</p><button class="pill" id="retry">${t("retry")}</button>`;
    $("#retry").onclick=init;
  }
}

const ic=(n,z=18)=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||""}</svg>`;
const fld=(i,l,inner)=>`<label class="fld"><span class="fl">${ic(i,16)}${l}</span>${inner}</label>`;
const skel=()=>`<div class="grid">${'<div class="card sk"><div class="frame"><div class="ph"></div></div><div class="info"><i></i><i></i></div></div>'.repeat(4)}</div>`;
let tmr;function toast(m){let e=$("#toast");if(!e){e=document.createElement("div");e.id="toast";e.className="toast";e.setAttribute("role","status");document.body.append(e)}e.innerHTML=ic("check",18)+m;e.hidden=false;clearTimeout(tmr);tmr=setTimeout(()=>e.hidden=true,3000)}
function bar(){
  const n=cart.reduce((a,i)=>a+i.qty,0),sum=cart.reduce((a,i)=>a+line(i).p.price*i.qty,0),D=CONFIG.DISCOUNT,net=sum-(n>=D.min?Math.round(sum*D.pct/100):0),b=$("#cbar");
  b.hidden=!n||!$("#drawer").hidden;
  b.innerHTML=`<span class="row2">${ic("cart",20)}${t("viewCart")} (${n})</span><span class="price">${money(net)}</span>`;
  document.body.classList.toggle("hascart",!b.hidden);
}
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const COLORS={noir:"#1b1b1d",blanc:"#f5f5f2",gris:"#8b9098",beige:"#d8c3a5",bleu:"#3b6ea8",rouge:"#c0392b",vert:"#4f7a5a",marron:"#7a5638"};
const swOn=c=>F.col===c?"on":"";
const F={q:"",col:"",sort:"",ok:false};
const cardHome=i=>{const p=P[i],out=!p.v.some(v=>v.ok),isNew=i===0;return`<article class="card click" data-i="${i}" tabindex="0"><div class="frame">${img(p.img||p.v[0]?.img,p.name)}${out?`<span class="tag no">${t("no")}</span>`:isNew?`<span class="new-badge">${t("newTag")}</span>`:""}</div>
  <div class="info"><div class="rating">${[1,2,3,4,5].map(()=>ic("star",13)).join("")}<span>(${24+(i*7)%40})</span></div><div class="meta"><h3>${esc(p.name)}</h3><span class="price">${money(p.price)}</span></div>
  <div class="meta"><span class="mute">${t("colors")(p.v.length)}</span><span class="dots">${p.v.map(v=>`<i class="dot" style="--c:${COLORS[v.col.toLowerCase()]||"#bbb"}" title="${esc(cap(v.col))}"></i>`).join("")}</span></div></div></article>`};
function home(){
  const q=norm(F.q);
  const list=P.map((_,i)=>i).filter(i=>{const p=P[i];return(!q||norm(p.name).includes(q))&&(!F.col||p.v.some(v=>v.col.toLowerCase()===F.col))&&(!F.ok||p.v.some(v=>v.ok))});
  if(F.sort)list.sort((a,b)=>(P[a].price-P[b].price)*(F.sort==="asc"?1:-1));
  $("#grid").innerHTML=list.map(cardHome).join("")||`<p class="state">${t("none")}</p>`;
}
function buildTools(){
  const cols=[...new Set(P.flatMap(p=>p.v.map(v=>v.col.toLowerCase())))];
  const o=(v,l,c)=>`<option value="${esc(v)}" ${c?"selected":""}>${esc(l)}</option>`;
  $("#tools").innerHTML=`<input id="q" type="search" placeholder="${t("search")}" value="${esc(F.q)}">
    <div class="swf"><button class="swb ${!F.col?"on":""}" data-c="" aria-label="${t("allCol")}">${ic("swap",14)}</button>${cols.map(c=>`<button class="swb ${swOn(c)}" data-c="${esc(c)}" style="--c:${COLORS[c]||"#bbb"}" aria-label="${esc(cap(c))}" title="${esc(cap(c))}"></button>`).join("")}</div>
    <select id="fs">${o("",t("sort"),!F.sort)}${o("asc",t("asc"),F.sort==="asc")}${o("desc",t("desc"),F.sort==="desc")}</select>
    <label class="chk"><input id="fo" type="checkbox" ${F.ok?"checked":""}><span>${t("onlyOk")}</span></label>`;
  $("#q").oninput=e=>{F.q=e.target.value;home()};
  $(".swf").onclick=e=>{const b=e.target.closest(".swb");if(!b)return;F.col=b.dataset.c;$(".swf .swb").forEach(x=>x.classList.toggle("on",x===b));home()};
  $("#fs").onchange=e=>{F.sort=e.target.value;home()};$("#fo").onchange=e=>{F.ok=e.target.checked;home()};
}
const lightbox=u=>{const d=document.createElement("div");d.className="lb";d.innerHTML=`<img src="${esc(u.replace("sz=w900","sz=w1600"))}" alt="">`;d.onclick=()=>d.remove();document.body.append(d)};
const fab=()=>{const a=$("#fab"),w=L["whatsApp link"];a.hidden=!w;if(w){a.href=wa(w);a.innerHTML=ic("wa",24)+"<span>WhatsApp</span>"}};

/* ===== VIEWS ===== */
function show(){
  document.querySelectorAll("[data-t]").forEach(e=>{const v=t(e.dataset.t);if(typeof v==="string")e.textContent=v});
  $("#lang-t").textContent=t("lang");document.querySelectorAll("[data-ic]").forEach(e=>e.innerHTML=ic(e.dataset.ic));$("#cnt").textContent=cart.reduce((a,i)=>a+i.qty,0);
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  if(!P.length)return;
  $("#home-view").hidden=cur!==null;$("#prod-view").hidden=cur===null;
  if(cur===null){
    home();
  }else{
    const p=P[cur];$("#p-name").textContent=p.name;$("#p-price").textContent=money(p.price);$("#promoTxt").textContent=t("promo")+" — "+t("promoEx")(money(p.price*2),money(Math.round(p.price*2*(100-CONFIG.DISCOUNT.pct)/100)));
    $("#vgrid").innerHTML=p.v.map((v,j)=>`<article class="card" data-j="${j}"><div class="frame">${img(v.img||p.img,p.name+" "+v.col,v.ok?"":"off")}<span class="tag ${v.ok?"ok":"no"}">${v.ok?t("ok"):t("no")}</span></div>
      <div class="info"><h3>${esc(cap(v.col))}</h3><span class="mute">${t("sizes")}</span>${v.ok&&v.sizes.length<=2?`<span class="low">${t("low")(v.sizes.length)}</span>`:""}
      <div class="sizes">${v.sizes.map(z=>`<button class="sz ${sel[j]===z?"on":""}" data-z="${esc(z)}" ${v.ok?"":"disabled"}>${esc(z)}</button>`).join("")}</div>
      <button class="btn" data-add ${v.ok&&sel[j]?"":"disabled"} style="margin-top:auto">${v.ok&&sel[j]?ic("cart",18):""}${v.ok?(sel[j]?t("add"):t("pick")):t("no")}</button></div></article>`).join("");
    $("#more-grid").innerHTML=P.map((_,i)=>i).filter(i=>i!==cur).slice(0,3).map(cardHome).join("");
  }
  socials();fab();bar();
}
const openModel=e=>{const c=e.target.closest(".card");if(c){cur=+c.dataset.i;sel={};show();scrollTo(0,0)}};
["#grid","#more-grid"].forEach(k=>{$(k).onclick=openModel;$(k).onkeydown=e=>{if(e.key==="Enter")openModel(e)}});
$("#back").onclick=()=>{cur=null;show()};
$("#home").onclick=()=>{cur=null;show();scrollTo(0,0)};
$("#vgrid").onclick=e=>{if(e.target.tagName==="IMG"){lightbox(e.target.src);return}
  const c=e.target.closest(".card"),b=e.target.closest("button");if(!c||!b)return;const j=+c.dataset.j;
  if(b.dataset.z){sel[j]=b.dataset.z;show()}
  else if(b.hasAttribute("data-add")&&!b.disabled){
    const f=cart.find(i=>i.pid===P[cur].id&&i.vi===j&&i.size===sel[j]);
    f?f.qty++:cart.push({pid:P[cur].id,vi:j,size:sel[j],qty:1});
    store("si_cart",cart);show();const nn=cart.reduce((a,i)=>a+i.qty,0);$("#cart-btn").classList.add("bump");setTimeout(()=>$("#cart-btn").classList.remove("bump"),350);toast(t("added")+" · "+(nn<CONFIG.DISCOUNT.min?t("promoHint"):t("promoOn")));
  }
};
$("#lang").onclick=()=>{lang=lang==="ar"?"fr":"ar";localStorage.setItem("si_lang",lang);if(P.length)buildTools();show();if(!$("#drawer").hidden)renderCart()};

function socials(){
  const ph=L["phone number"],n=[];
  if(ph){const d=digits(ph).replace(/^213/,"0");n.push([d.replace(/(\d{2})(?=\d)/g,"$1 "),"tel:"+d])}
  [["Facebook","facebook link"],["Instagram","instagram link"],["TikTok","tiktok link"]].forEach(([a,k])=>L[k]&&n.push([a,L[k]]));
  if(L["whatsApp link"])n.push(["WhatsApp",wa(L["whatsApp link"])]);
  const fs=n.map(([a,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${ic(({Facebook:"fb",Instagram:"ig",TikTok:"tt",WhatsApp:"wa"})[a]||"phone",16)}${esc(a)}</a>`).join("");
  $("#socials").innerHTML=fs;$("#fsocials").innerHTML=fs;
}

/* ===== CART ===== */
const line=i=>{const p=P.find(x=>x.id===i.pid);return{p,v:p.v[i.vi]}};
function openCart(){$("#shade").hidden=$("#drawer").hidden=false;document.body.style.overflow="hidden";renderCart();$("#cbar").hidden=true}
function closeCart(){$("#shade").hidden=$("#drawer").hidden=true;document.body.style.overflow="";if(P.length)bar()}
$("#cbar").onclick=()=>openCart();
$("#cart-btn").onclick=openCart;$("#shade").onclick=closeCart;
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeCart();document.querySelector(".lb")?.remove()}});
function renderCart(){
  const n=cart.reduce((a,i)=>a+i.qty,0),sum=cart.reduce((a,i)=>a+line(i).p.price*i.qty,0);
  const D=CONFIG.DISCOUNT,disc=n>=D.min?Math.round(sum*D.pct/100):0,net=sum-disc;
  const sv={nom:"",tel:"",tel2:"",wilaya:"",adresse:"",...(store("si_cust")||{})};
  $("#cnt").textContent=n;
  const head=`<div class="dh"><h3 class="row2">${ic("cart",22)}${t("cart")}</h3><button class="x" id="cx" aria-label="${t("close")}">&times;</button></div>`;
  if(!cart.length){$("#dbody").innerHTML=head+`<p class="state">${t("empty")}</p>`;$("#cx").onclick=closeCart;return}
  $("#dbody").innerHTML=head+`<p class="mute" style="margin:-6px 0 14px">${t("cartSlogan")}</p>`+cart.map((i,k)=>{const{p,v}=line(i);return`<div class="item" data-k="${k}">
    <div class="top"><span class="row2">${img(v.img||p.img,p.name,"thumb")}<span>${esc(p.name)} — ${esc(cap(v.col))}</span></span><button class="rm" data-rm>${t("remove")}</button></div>
    <div class="bot"><label class="mute">${t("size")} <select data-size>${v.sizes.map(z=>`<option ${z===i.size?"selected":""}>${esc(z)}</option>`).join("")}</select></label>
    <div class="qty"><button data-q="-1" aria-label="-">${ic("minus",14)}</button><span>${i.qty}</span><button data-q="1" aria-label="+">${ic("plus",14)}</button></div></div>
    <span class="price" style="justify-self:start">${money(p.price*i.qty)}</span></div>`}).join("")+
  `<div class="tots"><div><span class="mute">${t("sub")}</span><span>${money(sum)}</span></div>
   ${disc?`<div class="disc"><span>${t("disc")(D.pct)}</span><span>−${money(disc)}</span></div>`:""}
   <div class="tt"><span>${t("total")(n)}</span><span class="price">${money(net)}</span></div>
   ${n<D.min?`<p class="hint">${ic("tag",16)}${t("promoHint")}</p>`:""}</div>
   <h4 class="fh">${ic("user",18)}${t("details")}</h4>
   <form id="f" novalidate>
   ${fld("user",t("name"),`<input name="nom" required autocomplete="name" value="${esc(sv.nom)}">`)}
   <div class="two">${fld("phone",t("phone"),`<input name="tel" type="tel" required inputmode="tel" autocomplete="tel" placeholder="05 50 00 00 00" value="${esc(sv.tel)}">`)}
   ${fld("phone",t("phone2"),`<input name="tel2" type="tel" inputmode="tel" placeholder="06 60 00 00 00" value="${esc(sv.tel2)}">`)}</div>
   <div class="fld"><span class="fl">${ic("truck",16)}${t("deliv")}</span><div class="opts">
     <label class="opt"><input type="radio" name="livraison" value="bureau" ${sv.livraison==="bureau"?"checked":""}><span>${ic("building",20)}<b>${t("dBureau")}</b><small>${t("dBureauSub")}</small></span></label>
     <label class="opt"><input type="radio" name="livraison" value="domicile" ${sv.livraison==="domicile"?"checked":""}><span>${ic("home",20)}<b>${t("dHome")}</b></span></label></div></div>
   <div class="two">${fld("pin",t("wilaya"),`<select name="wilaya" required><option value="">—</option>${WILAYAS.map((w,k)=>`<option value="${esc(w)}" ${w===sv.wilaya?"selected":""}>${String(k+1).padStart(2,"0")} - ${esc(w)}</option>`).join("")}</select>`)}
   ${fld("home",t("commune"),`<input name="commune" required autocomplete="address-level2" value="${esc(sv.commune||"")}">`)}</div>
   ${fld("note",t("note"),`<textarea name="note" rows="2"></textarea>`)}
   <button class="btn" type="submit">${t("confirm")} · ${money(net)}</button></form>`;
  $("#cx").onclick=closeCart;$("#f").onsubmit=submit;
}
$("#dbody").addEventListener("click",e=>{
  const it=e.target.closest(".item");if(!it)return;const i=cart[+it.dataset.k];
  if(e.target.hasAttribute("data-rm"))cart.splice(+it.dataset.k,1);
  else if(e.target.dataset.q)i.qty=Math.max(1,Math.min(20,i.qty+ +e.target.dataset.q));else return;
  store("si_cart",cart);renderCart();show();
});
$("#dbody").addEventListener("change",e=>{
  if(!e.target.matches("[data-size]"))return;const it=e.target.closest(".item"),i=cart[+it.dataset.k];
  const dup=cart.find(x=>x!==i&&x.pid===i.pid&&x.vi===i.vi&&x.size===e.target.value);
  if(dup){dup.qty+=i.qty;cart.splice(+it.dataset.k,1)}else i.size=e.target.value;
  store("si_cart",cart);renderCart();
});

const LIV={bureau:"Bureau ZR Express",domicile:"Domicile"};
const PH=/^(\+?213\s?|0)?[567](\s?\d){8}$/;
async function submit(e){
  e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));
  f.querySelectorAll(".fe").forEach(x=>x.remove());f.querySelectorAll("[aria-invalid]").forEach(x=>x.removeAttribute("aria-invalid"));
  const er={};
  if(d.nom.trim().length<3)er.nom=t("eName");
  if(!PH.test(d.tel.trim()))er.tel=t("ePhone");
  if(d.tel2.trim()&&!PH.test(d.tel2.trim()))er.tel2=t("ePhone");
  if(!d.wilaya)er.wilaya=t("eWil");
  if(!d.livraison)er.livraison=t("eDeliv");if(d.commune.trim().length<2)er.commune=t("eCommune");
  const ks=Object.keys(er);
  if(ks.length){ks.forEach(k=>{const el=k==="livraison"?f.querySelector(".opts"):f.elements[k];el.setAttribute("aria-invalid","true");el.closest(".fld").insertAdjacentHTML("beforeend",`<small class="fe">${er[k]}</small>`)});const fe=ks[0]==="livraison"?f.querySelector(".opts"):f.elements[ks[0]];fe.scrollIntoView({block:"center"});if(fe.focus)fe.focus();return}
  const b=f.querySelector("[type=submit]");b.disabled=true;b.textContent=t("sending");
  store("si_cust",{nom:d.nom,tel:d.tel,tel2:d.tel2,wilaya:d.wilaya,commune:d.commune,livraison:d.livraison});
  const ref="SI-"+Date.now().toString(36).toUpperCase().slice(-6);
  const items=cart.map(i=>{const{p,v}=line(i);return{produit:p.name,couleur:v.col,taille:i.size,quantite:i.qty,prix:p.price}});
  const sub=items.reduce((a,i)=>a+i.prix*i.quantite,0),pairs=items.reduce((a,i)=>a+i.quantite,0),remise=pairs>=CONFIG.DISCOUNT.min?Math.round(sub*CONFIG.DISCOUNT.pct/100):0,total=sub-remise;
  if(CONFIG.SAVE_ORDER_TO_SHEET){try{await fetch(CONFIG.ORDER_API||CONFIG.API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({...d,livraison:LIV[d.livraison],ref,items,sous_total:sub,remise,total,date:new Date().toISOString()})})}catch(err){console.warn(err)}}
  const lines=items.map(i=>`• ${i.produit} — ${cap(i.couleur)}, ${i.taille} × ${i.quantite}`).join("\n");
  const msg=`${t("wMsg")} (${ref})\n${lines}\n\n${remise?`${t("disc")(CONFIG.DISCOUNT.pct)}: -${money(remise)}\n`:""}${money(total)}\n${d.nom}\n${d.tel}${d.tel2?" / "+d.tel2:""}\n${d.wilaya} - ${d.commune}\n${LIV[d.livraison]}`+(d.note?`\n${d.note}`:"");
  const w=L["whatsApp link"];
  cart=[];store("si_cart",cart);show();
  $("#dbody").innerHTML=`<div class="done"><div class="ok-ic">${ic("check",34)}</div><h3>${t("thanks")}</h3>
   <p class="mute">${t("thanksSub")}</p><p class="ref" id="refline">${t("ref")} <b dir="ltr">${ref}</b><button id="cpyref" aria-label="copy" style="background:none;border:0;color:inherit;cursor:pointer;margin-inline-start:6px;vertical-align:middle">${ic("copy",15)}</button></p>
   <div class="sum">${items.map(i=>`<div><span>${esc(i.produit)} — ${esc(cap(i.couleur))}, ${esc(i.taille)} × ${i.quantite}</span><span>${money(i.prix*i.quantite)}</span></div>`).join("")}${remise?`<div class="okd"><span>${t("disc")(CONFIG.DISCOUNT.pct)}</span><span>−${money(remise)}</span></div>`:""}<div class="st"><span>${t("totalL")}</span><span>${money(total)}</span></div></div>
   <p class="mute">${t(d.livraison==="bureau"?"dBureau":"dHome")} — ${esc(d.wilaya)}, ${esc(d.commune)}</p>
   <p class="mute">${t("next")(esc(d.tel))}</p>
   ${CONFIG.OPEN_WHATSAPP&&w?`<a class="btn" href="${esc(wa(w,msg))}" target="_blank" rel="noopener">${ic("wa",18)}${t("wa")}</a>`:""}
   <button class="pill" id="dc">${t("shop")}</button></div>`;
  $("#dc").onclick=()=>{closeCart();cur=null;show();scrollTo(0,0)};
  $("#cpyref").onclick=()=>{navigator.clipboard?.writeText(ref);toast(ref)};
}

$("#yr").textContent=new Date().getFullYear();
addEventListener("scroll",()=>{const h=document.documentElement,p=(h.scrollTop)/(h.scrollHeight-h.clientHeight||1);$("#prog").style.width=(p*100)+"%";$(".bar").classList.toggle("raised",h.scrollTop>4)},{passive:true});show();init();
</script>
